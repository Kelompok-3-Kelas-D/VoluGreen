{% load static %}
<!doctype html><html lang="id"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>{{ judul }} · VoluGreen</title><link rel="stylesheet" href="{% static 'css/style.css' %}"><link rel="stylesheet" href="{% static 'css/eksplorasi.css' %}"></head>
<body class="explore-body"><main class="wrap explore-main"><a href="{% url 'eksplorasi:koleksi_daftar' %}">← Kembali ke koleksi</a><section class="explore-card card collection-form-card"><span class="eyebrow">RENCANA AKSIMU</span><h1>{{ judul }}</h1><form method="post" class="explore-create-form">{% csrf_token %}{{ form.non_field_errors }}{% for field in form %}<label class="field"><span class="field-label">{{ field.label }}</span>{{ field }}{% for error in field.errors %}<small class="field-error">{{ error }}</small>{% endfor %}</label>{% endfor %}<button class="cta inline" type="submit">{{ tombol }} <span class="arrow">↗</span></button></form></section></main></body></html>
